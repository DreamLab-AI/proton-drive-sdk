[package]
name = "pdtui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Two-pane TUI for Proton Drive — personal use"

[lints]
workspace = true

[lib]
name = "pdtui"
path = "src/lib.rs"

[[bin]]
name = "pdtui"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
crossterm = "0.28"

# Real OS-native secret-store backends. Bare `keyring = "3"` has *no* default
# feature group (see the vendored crate's own Cargo.toml `[features]` block):
# with zero features enabled every platform silently falls back to the
# crate's in-process `mock` store, which cannot persist across a process
# restart. `linux-native` gives Linux the kernel keyutils retention service
# (real, session-scoped, persists across processes) with no extra runtime
# dependency — deliberately *not* `sync-secret-service`/D-Bus, which pulls in
# `dbus-secret-service` -> `libdbus-sys`, a build-time dependency on the
# system `libdbus-1-dev` + `pkg-config` that this dev/CI container does not
# have (that combination fails to build here). `apple-native` gives
# macOS/iOS Keychain, `windows-native` gives the Windows Credential Manager.
# On hosts with no reachable native backend (e.g. no session keyring)
# these calls fail at runtime and `session.rs` falls back to its 0600
# secret-file store, which remains the persistence path of record
# regardless of which keyring backend is compiled in (ADR-0007, personal
# use).
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
rand.workspace = true
ratatui = "0.29"
reqwest.workspace = true
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["signal", "rt-multi-thread", "macros", "sync", "io-util", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror.workspace = true
futures.workspace = true
proton-drive = { path = "../../crates/proton-drive" }
proton-drive-api = { path = "../../crates/proton-drive-api" }
proton-drive-cache = { path = "../../crates/proton-drive-cache" }
proton-drive-crypto = { path = "../../crates/proton-drive-crypto" }

# Test-only: a hand-rolled loopback HTTP/1.1 mock server for
# ReqwestHttpClient retry/backoff tests (src/http.rs) needs `net`. No
# mock-HTTP-server crate (wiremock etc.) is added -- the raw TCP mock is
# enough for status-code branching tests and keeps the dependency graph
# unchanged.
[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
